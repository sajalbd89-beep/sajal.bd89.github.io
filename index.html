<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sazal's Tech Space</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 90%;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .badge-container {
            margin: 1.5rem 0;
        }
        .badge {
            background-color: #0369a1;
            color: #e0f2fe;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin: 0.3rem;
        }
        .btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .btn:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
        }
        footer {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hello, I'm Sazal! 👋</h1>
    <p>Welcome to my live GitHub Pages website. I am exploring software development, web technologies, and building cool things with code.</p>
    
    <div class="badge-container">
        <span class="badge">💻 Software Engineering</span>
        <span class="badge">🚀 Web Development</span>
        <span class="badge">🤖 AI & Tech</span>
    </div>

    <a href="https://github.com/sajalbd89-beep" target="_blank" class="btn">Visit My GitHub Profile</a>
    
    <footer>
        &copy; 2026 Sazal. Powered by GitHub Pages.
    </footer>
</div>

</body>
</html>
